<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Victor Chiemerie</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    /* Standalone on purpose: a 404 must render even if the bundle fails. */
    :root { --bg:#F4F2F9; --fg:#16141D; --muted:#5B5570; --accent:#7A63FF; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#121017; --fg:#F2F0F8; --muted:#B3AEC6; }
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--fg);
      font-family:Lato,"Helvetica Neue",Helvetica,Arial,sans-serif;
      min-height:100vh; display:grid; place-items:center; padding:32px;
      -webkit-font-smoothing:antialiased;
    }
    .wrap { max-width:560px; }
    .eyebrow {
      font-size:12px; letter-spacing:.08em; text-transform:uppercase;
      color:var(--muted); margin-bottom:20px;
    }
    h1 { font-size:clamp(32px,6vw,64px); font-weight:700; line-height:1.05; letter-spacing:-.02em; }
    p { margin-top:18px; font-size:17px; line-height:1.6; color:var(--muted); }
    .links { margin-top:36px; display:flex; gap:14px; flex-wrap:wrap; }
    a.btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:14px 24px; border-radius:999px; text-decoration:none;
      background:var(--accent); color:#fff; font-size:14px;
      transition:background .25s;
    }
    a.btn:hover { background:#5B44E0; }
    a.ghost { background:transparent; color:var(--fg); border:1px solid rgba(128,128,128,.35); }
    a.ghost:hover { background:rgba(128,128,128,.12); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Error 404</div>
    <h1>This page doesn't exist.</h1>
    <p>The link may be out of date, or the page has moved. The work is all still here.</p>
    <div class="links">
      <a class="btn" href="/">Go home</a>
      <a class="btn ghost" href="/work/">See the work</a>
    </div>
  </div>
</body>
</html>
